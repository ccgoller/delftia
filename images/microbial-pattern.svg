<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" fill="none">
  <g stroke="#f4a854" stroke-width="1.5" stroke-linecap="round">
    <!-- rod-shaped bacilli with wavy polar flagella (Delftia is a motile rod) -->
    <g transform="rotate(-24 50 40)">
      <rect x="30" y="32" width="40" height="14" rx="7" fill="#e8954b" fill-opacity=".14" stroke-opacity=".5"/>
      <path d="M30 39c-5-5-9 5-14 0s-9 5-14 0" stroke-opacity=".38"/>
      <path d="M40 39h20" stroke-opacity=".2" stroke-dasharray="1 3"/>
    </g>
    <g transform="rotate(19 175 123)">
      <rect x="150" y="116" width="46" height="15" rx="7.5" fill="#e8954b" fill-opacity=".12" stroke-opacity=".5"/>
      <path d="M196 123c5-5 9 5 14 0s9 5 14 0" stroke-opacity=".38"/>
      <path d="M160 123h26" stroke-opacity=".2" stroke-dasharray="1 3"/>
    </g>
    <g transform="rotate(62 118 78)">
      <rect x="102" y="72" width="32" height="11" rx="5.5" fill="#ffda73" fill-opacity=".1" stroke-opacity=".4"/>
      <path d="M134 77c4-4 8 4 12 0" stroke-opacity=".3"/>
    </g>
    <!-- cocci / dividing cells -->
    <circle cx="202" cy="44" r="7" fill="#f4a854" fill-opacity=".1" stroke-opacity=".4"/>
    <circle cx="214" cy="50" r="6" fill="#f4a854" fill-opacity=".1" stroke-opacity=".4"/>
    <circle cx="82" cy="137" r="5" fill="#f4a854" fill-opacity=".1" stroke-opacity=".35"/>
    <circle cx="20" cy="110" r="4" fill="#ffda73" fill-opacity=".1" stroke-opacity=".3"/>
    <circle cx="24" cy="120" r="3" fill="#ffda73" fill-opacity=".1" stroke-opacity=".3"/>
  </g>
</svg>
