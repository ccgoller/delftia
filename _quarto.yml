project:
  type: website
  render:
    - "*.qmd"
  resources:
    - "!tests/**"
    - "!node_modules/**"
    - "!playwright-report/**"
    - "!test-results/**"
    - "!package*.json"
    - "!playwright.config.js"

website:
  title: "The Delftia Project"
  site-url: "https://delftia.org/"
  repo-url: "https://github.com/ccgoller/delftia"
  favicon: images/cropped-cropped-DelftiaLogo-e1594312941275-32x32.png
  description: "Exploring the biology and applications of Delftia acidovorans through undergraduate research, citizen science, and community collaboration."
  open-graph:
    title: "The Delftia Project"
    description: "Exploring the biology and applications of Delftia acidovorans through undergraduate research, citizen science, and community collaboration."

  navbar:
    logo: images/DelftiaLogo-e1594312941275.png
    logo-alt: "Delftia Project logo"
    background: "#1a1410"
    foreground: "white"
    search: false
    right:
      - href: about.qmd
        text: About
      - href: learn.qmd
        text: Learn
      - href: dashboard.qmd
        text: Dashboard
      - text: Research
        menu:
          - href: research.qmd
            text: Research Projects
          - href: news.qmd
            text: Student Projects
          - href: references.qmd
            text: Publications
      - href: people.qmd
        text: People
      - text: "Get Involved"
        href: about.qmd#get-involved

  page-footer:
    background: "#1a1410"
    foreground: "white"
    left: "© 2026 The Delftia Project · NC State University"
    right:
      - text: "Home"
        href: index.qmd
      - text: "About"
        href: about.qmd
      - text: "Research"
        href: research.qmd
      - text: "People"
        href: people.qmd
      - text: "Dashboard"
        href: dashboard.qmd
      - text: "Learn"
        href: learn.qmd
      - text: "Student Projects"
        href: news.qmd
      - text: "Publications"
        href: references.qmd

format:
  html:
    theme:
      - cosmo
      - theme.scss
    css: styles.css
    toc: false
    include-before-body: _before-body.html
