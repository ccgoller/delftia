name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check GitHub Pages configuration
        uses: actions/github-script@v7
        with:
          script: |
            const settingsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages`;
            const expectedDomain = require("fs").readFileSync("CNAME", "utf8").trim();
            const params = { owner: context.repo.owner, repo: context.repo.repo };
            let { data: pages } = await github.request("GET /repos/{owner}/{repo}/pages", params);
            if (pages.build_type !== "workflow" || pages.cname !== expectedDomain) {
              try {
                await github.request("PUT /repos/{owner}/{repo}/pages", {
                  ...params,
                  build_type: "workflow",
                  cname: expectedDomain
                });
                ({ data: pages } = await github.request("GET /repos/{owner}/{repo}/pages", params));
              } catch (error) {
                core.setFailed(
                  `Cannot configure GitHub Pages (${error.message}). ` +
                  `At ${settingsUrl}, set "Build and deployment" > "Source" to "GitHub Actions" ` +
                  `and "Custom domain" to "${expectedDomain}", then re-run this workflow. ` +
                  "A branch-based Pages build can overwrite this deployment with raw source files and cause 404s."
                );
                return;
              }
            }
            if (pages.build_type !== "workflow" || pages.cname !== expectedDomain) {
              core.setFailed(
                `GitHub Pages settings did not persist. At ${settingsUrl}, select "GitHub Actions" ` +
                `and set the custom domain to "${expectedDomain}", then re-run this workflow.`
              );
              return;
            }
            core.info(`GitHub Pages uses GitHub Actions and the custom domain ${expectedDomain}.`);

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Clean previous site output
        run: rm -rf _site

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Publish custom domain
        run: |
          set -euo pipefail
          cp CNAME _site/CNAME
          touch _site/.nojekyll

      - name: Verify generated pages before upload
        run: |
          set -euo pipefail
          expected_pages=(
            "index.html"
            "about.html"
            "news.html"
            "references.html"
          )

          missing_count=0
          for page in "${expected_pages[@]}"; do
            if [ ! -s "_site/${page}" ]; then
              echo "❌ Missing generated page: _site/${page}"
              missing_count=$((missing_count + 1))
            fi
          done

          html_count="$(find _site -type f -name '*.html' | wc -l | tr -d '[:space:]')"
          if [ "${html_count}" -eq 0 ]; then
            echo "❌ No generated HTML files found in _site."
            missing_count=$((missing_count + 1))
          fi

          if [ "${missing_count}" -ne 0 ]; then
            echo "Generated files in _site (for diagnosis):"
            find _site -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "✅ Found expected generated pages and ${html_count} total HTML files in _site."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Derive custom-domain base URL
        id: pages-base-url
        run: |
          set -euo pipefail
          domain="$(tr -d '[:space:]' < CNAME)"
          echo "base_url=https://${domain}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed Pages URLs are publicly accessible
        env:
          BASE_URL: ${{ steps.pages-base-url.outputs.base_url }}
        run: |
          set -euo pipefail
          base_url="${BASE_URL%/}"
          if [ -z "${base_url}" ]; then
            echo "❌ BASE_URL is empty."
            exit 1
          fi

          urls=(
            "${base_url}/"
            "${base_url}/about.html"
            "${base_url}/news.html"
            "${base_url}/references.html"
          )

          failed_urls=()
          for url in "${urls[@]}"; do
            echo "Checking ${url} (allowing for GitHub Pages propagation)..."
            if status="$(curl --silent --show-error --location --fail \
              --retry 30 --retry-delay 10 --retry-all-errors \
              --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "${url}")" && [ "${status}" = "200" ]; then
              echo "✅ ${url} returned HTTP 200."
            else
              echo "⚠️ ${url} did not return HTTP 200 within retry window."
              failed_urls+=("${url}")
            fi
          done

          if [ "${#failed_urls[@]}" -ne 0 ]; then
            echo "❌ Some deployed URLs were not reachable after retries."
            echo "This may indicate an unusually slow GitHub Pages propagation or a deployment issue."
            echo "Check Settings > Pages: custom domain delftia.org, DNS check successful, and HTTPS certificate ready."
            echo "At your DNS provider, point the apex domain to GitHub Pages (not to a repository path)."
            echo "Unreachable URLs:"
            for url in "${failed_urls[@]}"; do
              echo " - ${url}"
            done
            exit 1
          fi

          echo "Waiting 60 seconds and re-checking to ensure the deployment is not overwritten..."
          sleep 60

          overwritten_urls=()
          for url in "${urls[@]}"; do
            if status="$(curl --silent --show-error --location --fail \
              --retry 3 --retry-delay 10 --retry-all-errors \
              --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "${url}")" && [ "${status}" = "200" ]; then
              echo "✅ ${url} still returns HTTP 200."
            else
              echo "❌ ${url} stopped responding after initially succeeding."
              overwritten_urls+=("${url}")
            fi
          done

          if [ "${#overwritten_urls[@]}" -ne 0 ]; then
            echo "❌ The deployment was overwritten shortly after it succeeded."
            echo "This usually means a competing 'pages build and deployment' (branch-based Pages source) replaced it."
            echo "Set Settings > Pages > Build and deployment > Source to 'GitHub Actions' and re-run this workflow."
            exit 1
          else
            echo "✅ All expected deployed URLs are publicly reachable and stable."
          fi

      - name: Check deployed page color contrast (axe color-contrast)
        env:
          BASE_URL: ${{ steps.pages-base-url.outputs.base_url }}
        run: |
          set -euo pipefail
          base_url="${BASE_URL%/}"
          urls=(
            "${base_url}/"
            "${base_url}/about.html"
            "${base_url}/news.html"
            "${base_url}/references.html"
          )

          failures=0
          skipped=0
          for url in "${urls[@]}"; do
            if ! curl --silent --show-error --location --fail \
              --retry 30 --retry-delay 10 --retry-all-errors \
              --max-time 30 \
              "${url}" > /dev/null; then
              echo "::warning::Skipping color-contrast audit for ${url} because the page is not yet reachable."
              skipped=$((skipped + 1))
              continue
            fi

            echo "Running color-contrast audit for ${url}"
            report_file="$(mktemp)"
            launch_config_file="$(mktemp --suffix=.cjs)"
            printf '%s\n' 'module.exports = { chromeLaunchConfig: { args: ["--no-sandbox", "--disable-setuid-sandbox"] } };' > "${launch_config_file}"
            npx --yes pa11y "${url}" \
              --runner axe \
              --config "${launch_config_file}" \
              --reporter json \
              --threshold 9999 > "${report_file}"

            if ! python -c $'import json\nimport sys\n\nurl = sys.argv[1]\nreport_path = sys.argv[2]\n\nwith open(report_path, "r", encoding="utf-8") as handle:\n    issues = json.load(handle)\n\ncontrast_issues = [\n    issue for issue in issues\n    if "color-contrast" in (issue.get("code") or "")\n]\n\nif contrast_issues:\n    print(f"❌ {url}: {len(contrast_issues)} color-contrast issue(s) found.")\n    for issue in contrast_issues[:10]:\n        selector = issue.get("selector", "n/a")\n        message = issue.get("message", "")\n        print(f"  - {selector}: {message}")\n    sys.exit(1)\n\nprint(f"✅ {url}: no color-contrast issues found.")' "${url}" "${report_file}"
            then
              failures=$((failures + 1))
            fi

            rm -f "${report_file}" "${launch_config_file}"
          done

          if [ "${failures}" -ne 0 ]; then
            echo "::warning::Color contrast audit found issues on ${failures} page(s). See logs for selectors and messages."
          fi

          if [ "${skipped}" -ne 0 ]; then
            echo "::warning::Color contrast audit skipped ${skipped} page(s) that were not reachable yet."
          fi

          if [ "${failures}" -eq 0 ] && [ "${skipped}" -eq 0 ]; then
            echo "✅ Color contrast audit passed on all pages."
          fi
