name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Clean previous site output
        run: rm -rf _site

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          max_attempts=120
          sleep_seconds=5
          pages=("index.html" "about.html" "news.html" "references.html")
          base_url="${PAGE_URL%/}"
          if [ -z "${base_url}" ]; then
            base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          for page in "${pages[@]}"; do
            url="${base_url}/${page}"
            echo "Checking ${url}"
            for attempt in $(seq 1 "${max_attempts}"); do
              status_code="$(curl -sS -L --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" "${url}" || true)"
              if [ "${status_code}" = "200" ]; then
                echo "✅ ${url} is live"
                break
              fi
              if [ "${attempt}" -eq "${max_attempts}" ]; then
                echo "❌ ${url} did not return HTTP 200 (last status: ${status_code})"
                exit 1
              fi
              echo "Waiting for publication (attempt ${attempt}/${max_attempts}, status ${status_code})"
              sleep "${sleep_seconds}"
            done
          done

          root_url="${base_url}/"
          echo "Checking ${root_url}"
          for attempt in $(seq 1 "${max_attempts}"); do
            status_code="$(curl -sS -L --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" "${root_url}" || true)"
            if [ "${status_code}" = "200" ]; then
              echo "✅ ${root_url} is live"
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "❌ ${root_url} did not return HTTP 200 (last status: ${status_code})"
              exit 1
            fi
            echo "Waiting for publication (attempt ${attempt}/${max_attempts}, status ${status_code})"
            sleep "${sleep_seconds}"
          done
