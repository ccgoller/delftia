name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Clean previous site output
        run: rm -rf _site

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Publish CNAME only when repository CNAME exists
        run: |
          set -euo pipefail
          if [ -f CNAME ]; then
            cp CNAME _site/CNAME
            echo "Published _site/CNAME from repository CNAME file."
          else
            echo "No repository CNAME file found; publishing with default github.io domain."
          fi

      - name: Verify generated pages before upload
        run: |
          set -euo pipefail
          if [ ! -s "_site/index.html" ]; then
            echo "❌ Missing generated home page: _site/index.html"
            exit 1
          fi
          html_count="$(find _site -type f -name '*.html' | wc -l | tr -d '[:space:]')"
          if [ "${html_count}" -eq 0 ]; then
            echo "❌ No generated HTML files found in _site."
            exit 1
          fi
          echo "✅ Generated home page and ${html_count} HTML files in _site."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed pages return HTTP 200
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail

          base_url="${PAGE_URL%/}"
          if [ -z "${base_url}" ]; then
            echo "❌ Deployment page URL is empty."
            exit 1
          fi

          check_url() {
            local url="$1"
            local max_attempts=8
            local delay_seconds=10
            local attempt=1
            local status_code=""

            while [ "${attempt}" -le "${max_attempts}" ]; do
              status_code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "${url}")"
              if [ "${status_code}" = "200" ]; then
                echo "✅ ${url} returned HTTP 200"
                return 0
              fi

              echo "Attempt ${attempt}/${max_attempts}: ${url} returned HTTP ${status_code}"
              if [ "${attempt}" -lt "${max_attempts}" ]; then
                sleep "${delay_seconds}"
              fi
              attempt=$((attempt + 1))
            done

            echo "❌ ${url} did not return HTTP 200 after ${max_attempts} attempts."
            return 1
          }

          check_url "${base_url}/"
          check_url "${base_url}/about.html"
          check_url "${base_url}/news.html"
          check_url "${base_url}/references.html"
