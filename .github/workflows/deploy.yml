name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Clean previous site output
        run: rm -rf _site

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Ensure custom-domain CNAME is published
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          if [ -n "${CUSTOM_DOMAIN:-}" ]; then
            domain="$(echo "${CUSTOM_DOMAIN}" | xargs)"
            echo "${domain}" > _site/CNAME
            echo "Published _site/CNAME from vars.CUSTOM_DOMAIN: ${domain}"
          elif [ -f CNAME ]; then
            cp CNAME _site/CNAME
            echo "Published _site/CNAME from repository CNAME file."
          else
            echo "No custom domain configured (vars.CUSTOM_DOMAIN or repository CNAME)."
          fi

      - name: Verify generated pages before upload
        run: |
          set -euo pipefail
          if [ ! -s "_site/index.html" ]; then
            echo "❌ Missing generated home page: _site/index.html"
            exit 1
          fi
          html_count="$(find _site -type f -name '*.html' | wc -l | tr -d '[:space:]')"
          if [ "${html_count}" -eq 0 ]; then
            echo "❌ No generated HTML files found in _site."
            exit 1
          fi
          echo "✅ Generated home page and ${html_count} HTML files in _site."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
