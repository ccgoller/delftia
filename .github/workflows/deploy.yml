name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          pages=("" "about.html" "news.html" "references.html")
          for page in "${pages[@]}"; do
            url="${PAGE_URL}${page}"
            echo "Checking ${url}"
            for attempt in {1..12}; do
              status_code="$(curl -sS -L -o /dev/null -w "%{http_code}" "${url}")"
              if [ "${status_code}" = "200" ]; then
                echo "✅ ${url} is live"
                break
              fi
              if [ "${attempt}" -eq 12 ]; then
                echo "❌ ${url} did not return HTTP 200 (last status: ${status_code})"
                exit 1
              fi
              echo "Waiting for publication (attempt ${attempt}/12, status ${status_code})"
              sleep 10
            done
          done
