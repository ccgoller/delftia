name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # ============================================================
      # 1. PRE-BUILD CHECKS: Validate GitHub Pages configuration
      # ============================================================
      - name: Check GitHub Pages configuration
        uses: actions/github-script@v7
        with:
          script: |
            const settingsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/settings/pages`;
            const expectedDomain = require("fs").readFileSync("CNAME", "utf8").trim();
            const params = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: pages } = await github.request("GET /repos/{owner}/{repo}/pages", params);
            core.info(`GitHub Pages settings: build_type="${pages.build_type}", cname="${pages.cname}".`);
            if (pages.build_type !== "workflow" || pages.cname !== expectedDomain) {
              core.setFailed(
                `GitHub Pages settings do not match the expected configuration. At ${settingsUrl}, ` +
                `set "Build and deployment" > "Source" to "GitHub Actions" and "Custom domain" ` +
                `to "${expectedDomain}", then re-run this workflow.`
              );
              return;
            }
            core.info(`✅ GitHub Pages uses GitHub Actions and the custom domain ${expectedDomain}.`);

      # ============================================================
      # 2. BUILD SETUP: Configure pages and Quarto
      # ============================================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.19'

      - name: Clean previous site output
        run: rm -rf _site

      # ============================================================
      # 3. BUILD: Render the Quarto website
      # ============================================================
      - name: Render Quarto site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Prepare deployment (copy CNAME and .nojekyll)
        run: |
          set -euo pipefail
          cp CNAME _site/CNAME
          touch _site/.nojekyll

      # ============================================================
      # 4. PRE-DEPLOY VALIDATION: Verify all pages generated
      # ============================================================
      - name: Verify generated pages before upload
        run: |
          set -euo pipefail
          expected_pages=(
            "index.html"
            "about.html"
            "news.html"
            "references.html"
          )

          missing_count=0
          for page in "${expected_pages[@]}"; do
            if [ ! -s "_site/${page}" ]; then
              echo "❌ Missing generated page: _site/${page}"
              missing_count=$((missing_count + 1))
            fi
          done

          html_count="$(find _site -type f -name '*.html' | wc -l | tr -d '[:space:]')"
          if [ "${html_count}" -eq 0 ]; then
            echo "❌ No generated HTML files found in _site."
            missing_count=$((missing_count + 1))
          fi

          if [ "${missing_count}" -ne 0 ]; then
            echo "Generated files in _site (for diagnosis):"
            find _site -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "✅ All expected pages generated: ${html_count} total HTML files in _site."

      - name: Set up Node for browser checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install browser check dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Check themes, screenshots, and color contrast before publishing
        run: npm test

      - name: Upload browser check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # ============================================================
      # 5. DEPLOYMENT: Upload and deploy only after browser checks pass
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ============================================================
      # 6. POST-DEPLOYMENT VERIFICATION: Validate live site
      # ============================================================
      - name: Prepare base URL for verification
        id: pages-base-url
        run: |
          set -euo pipefail
          domain="$(tr -d '[:space:]' < CNAME)"
          echo "base_url=https://${domain}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed pages are publicly accessible
        env:
          BASE_URL: ${{ steps.pages-base-url.outputs.base_url }}
        run: |
          set -euo pipefail
          base_url="${BASE_URL%/}"
          if [ -z "${base_url}" ]; then
            echo "❌ BASE_URL is empty. Cannot verify deployment."
            exit 1
          fi

          urls=(
            "${base_url}/"
            "${base_url}/about.html"
            "${base_url}/news.html"
            "${base_url}/references.html"
          )

          failed_urls=()
          for url in "${urls[@]}"; do
            echo "Checking ${url} (allowing for GitHub Pages propagation)..."
            if status="$(curl --silent --show-error --location --fail \
              --retry 30 --retry-delay 10 --retry-all-errors \
              --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "${url}")" && [ "${status}" = "200" ]; then
              echo "✅ ${url} returned HTTP 200."
            else
              echo "⚠️ ${url} did not return HTTP 200 within retry window."
              failed_urls+=("${url}")
            fi
          done

          if [ "${#failed_urls[@]}" -ne 0 ]; then
            echo "❌ Some deployed URLs were not reachable after retries."
            echo "This may indicate an unusually slow GitHub Pages propagation or a deployment issue."
            echo "Check Settings > Pages: custom domain delftia.org, DNS check successful, and HTTPS certificate ready."
            echo "At your DNS provider, point the apex domain to GitHub Pages (not to a repository path)."
            echo "Unreachable URLs:"
            for url in "${failed_urls[@]}"; do
              echo " - ${url}"
            done
            exit 1
          fi

          echo "Waiting 60 seconds to verify deployment persists (no conflicts)..."
          sleep 60

          overwritten_urls=()
          for url in "${urls[@]}"; do
            if status="$(curl --silent --show-error --location --fail \
              --retry 3 --retry-delay 10 --retry-all-errors \
              --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "${url}")" && [ "${status}" = "200" ]; then
              echo "✅ ${url} still returns HTTP 200."
            else
              echo "❌ ${url} stopped responding after initially succeeding."
              overwritten_urls+=("${url}")
            fi
          done

          if [ "${#overwritten_urls[@]}" -ne 0 ]; then
            echo "❌ The deployment was overwritten shortly after it succeeded."
            echo "This usually means a competing 'pages build and deployment' (branch-based Pages source) replaced it."
            echo "Set Settings > Pages > Build and deployment > Source to 'GitHub Actions' and re-run this workflow."
            exit 1
          fi

          echo "Verifying deployed HTML and stylesheet match the build artifact..."
          content_paths=(
            "index.html"
            "about.html"
            "news.html"
            "references.html"
            "styles.css"
          )
          mismatched_paths=()
          for path in "${content_paths[@]}"; do
            url="${base_url}/${path}"
            downloaded_file="$(mktemp)"
            if ! curl --silent --show-error --location --fail \
              --retry 3 --retry-delay 10 --retry-all-errors \
              --max-time 30 \
              --output "${downloaded_file}" \
              "${url}"; then
              echo "❌ Could not download ${url} for content verification."
              mismatched_paths+=("${path}")
            elif ! cmp --silent "_site/${path}" "${downloaded_file}"; then
              expected_hash="$(sha256sum "_site/${path}" | cut -d ' ' -f 1)"
              actual_hash="$(sha256sum "${downloaded_file}" | cut -d ' ' -f 1)"
              echo "❌ ${url} does not match the generated artifact (expected ${expected_hash}, got ${actual_hash})."
              mismatched_paths+=("${path}")
            else
              echo "✅ ${url} matches the generated artifact."
            fi
            rm -f "${downloaded_file}"
          done

          if [ "${#mismatched_paths[@]}" -ne 0 ]; then
            echo "❌ Deployed content differs from this run's build artifact."
            echo "Check for stale GitHub Pages/CDN content or a competing deployment."
            exit 1
          fi

          echo "✅ All expected deployed URLs are stable and their content matches this build."
