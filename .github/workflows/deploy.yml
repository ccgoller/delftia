name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Clean previous site output
        run: rm -rf _site

      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Publish CNAME only when repository CNAME exists
        run: |
          set -euo pipefail
          if [ -f CNAME ]; then
            cp CNAME _site/CNAME
            echo "Published _site/CNAME from repository CNAME file."
          else
            echo "No repository CNAME file found; publishing with default github.io domain."
          fi

      - name: Verify generated pages before upload
        run: |
          set -euo pipefail
          if [ ! -s "_site/index.html" ]; then
            echo "❌ Missing generated home page: _site/index.html"
            exit 1
          fi
          html_count="$(find _site -type f -name '*.html' | wc -l | tr -d '[:space:]')"
          if [ "${html_count}" -eq 0 ]; then
            echo "❌ No generated HTML files found in _site."
            exit 1
          fi
          echo "✅ Generated home page and ${html_count} HTML files in _site."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Pages URLs are publicly accessible
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          if [ -z "${base_url}" ]; then
            echo "❌ deployment page_url output is empty."
            exit 1
          fi

          urls=(
            "${base_url}/"
            "${base_url}/about.html"
            "${base_url}/news.html"
            "${base_url}/references.html"
          )

          for url in "${urls[@]}"; do
            echo "Checking ${url}"
            curl --silent --show-error --location --fail \
              --retry 6 --retry-delay 10 --retry-all-errors \
              --max-time 30 \
              "${url}" > /dev/null
            echo "✅ ${url} returned HTTP 200."
          done

      - name: Check deployed page color contrast (axe color-contrast)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          urls=(
            "${base_url}/"
            "${base_url}/about.html"
            "${base_url}/news.html"
            "${base_url}/references.html"
          )

          failures=0
          for url in "${urls[@]}"; do
            echo "Running color-contrast audit for ${url}"
            report_file="$(mktemp)"
            npx --yes pa11y "${url}" \
              --runner axe \
              --reporter json \
              --threshold 9999 > "${report_file}"

            if ! python - "${url}" "${report_file}" <<'PY'
            import json
            import sys

            url = sys.argv[1]
            report_path = sys.argv[2]

            with open(report_path, "r", encoding="utf-8") as handle:
                issues = json.load(handle)

            contrast_issues = [
                issue for issue in issues
                if "color-contrast" in (issue.get("code") or "")
            ]

            if contrast_issues:
                print(f"❌ {url}: {len(contrast_issues)} color-contrast issue(s) found.")
                for issue in contrast_issues[:10]:
                    selector = issue.get("selector", "n/a")
                    message = issue.get("message", "")
                    print(f"  - {selector}: {message}")
                sys.exit(1)

            print(f"✅ {url}: no color-contrast issues found.")
            PY
            then
              failures=$((failures + 1))
            fi

            rm -f "${report_file}"
          done

          if [ "${failures}" -ne 0 ]; then
            echo "❌ Color contrast audit failed on ${failures} page(s)."
            exit 1
          fi
