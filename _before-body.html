<!-- Theme Toggle and Initialization -->
<script>
  // Initialize theme based on user preference and localStorage
  (function() {
    const savedTheme = localStorage.getItem('delftia-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = savedTheme || (prefersDark ? 'dark' : 'light');
    
    // Apply theme immediately to prevent flash
    document.documentElement.setAttribute('data-theme', theme);
    if (theme === 'dark') {
      document.documentElement.classList.add('dark-mode');
      document.body.classList.add('dark-mode');
    } else {
      document.documentElement.classList.add('light-mode');
      document.body.classList.add('light-mode');
    }
  })();
</script>

<!-- Theme Toggle Button in Navbar -->
<style>
  .navbar-nav-custom {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-left: auto;
  }
  
  #quarto-navbar .navbar-nav-custom {
    flex-direction: row-reverse;
  }
</style>

<script>
  // Add theme toggle button to navbar after page loads
  document.addEventListener('DOMContentLoaded', function() {
    const navbar = document.querySelector('#quarto-navbar .navbar-collapse .navbar-nav');
    
    if (navbar) {
      // Create theme toggle button
      const toggleContainer = document.createElement('div');
      toggleContainer.style.cssText = 'display: flex; align-items: center; gap: 1rem; margin-left: 1rem;';
      
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'theme-toggle';
      toggleBtn.setAttribute('aria-label', 'Toggle dark mode');
      toggleBtn.setAttribute('title', 'Toggle dark/light theme');
      
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
      toggleBtn.innerHTML = currentTheme === 'dark' 
        ? '☀️ Light' 
        : '🌙 Dark';
      
      toggleBtn.addEventListener('click', function() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme') || 'light';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        // Update theme
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('delftia-theme', newTheme);
        
        // Update body classes
        document.body.classList.remove('light-mode', 'dark-mode');
        document.body.classList.add(newTheme === 'dark' ? 'dark-mode' : 'light-mode');
        
        // Update button text
        toggleBtn.innerHTML = newTheme === 'dark' 
          ? '☀️ Light' 
          : '🌙 Dark';
      });
      
      toggleContainer.appendChild(toggleBtn);
      navbar.appendChild(toggleContainer);
    }
  });
</script>
