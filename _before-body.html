<!-- Theme Toggle and Initialization -->
<script>
  // Initialize theme based on user preference and localStorage
  (function() {
    const preference = window.matchMedia('(prefers-color-scheme: dark)');
    let savedTheme;
    let readingFocus = false;
    try {
      savedTheme = localStorage.getItem('delftia-theme');
      readingFocus = localStorage.getItem('delftia-reading-focus') === 'true';
    } catch {
      // Theme selection still works when browser storage is unavailable.
    }
    let explicitTheme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : null;

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const button = document.querySelector('.theme-toggle');
      if (button) {
        button.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
        button.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }
    }

    applyTheme(explicitTheme || (preference.matches ? 'dark' : 'light'));
    function applyReadingFocus() {
      document.documentElement.setAttribute('data-reading-focus', String(readingFocus));
      const button = document.querySelector('.reading-toggle');
      if (button) button.setAttribute('aria-pressed', String(readingFocus));
    }
    applyReadingFocus();
    preference.addEventListener('change', function(event) {
      if (!explicitTheme) applyTheme(event.matches ? 'dark' : 'light');
    });

    document.addEventListener('DOMContentLoaded', function() {
      const header = document.querySelector('#quarto-header');
      if (!header) return;

      const container = document.createElement('div');
      container.className = 'display-controls';
      container.setAttribute('role', 'group');
      container.setAttribute('aria-label', 'Display preferences');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'theme-toggle';
      container.appendChild(button);
      const readingButton = document.createElement('button');
      readingButton.type = 'button';
      readingButton.className = 'reading-toggle';
      readingButton.textContent = 'Reading focus';
      readingButton.setAttribute('aria-label', 'Reading focus');
      readingButton.title = 'Simplify the layout and increase text spacing';
      container.appendChild(readingButton);
      header.appendChild(container);
      applyTheme(document.documentElement.getAttribute('data-theme'));
      applyReadingFocus();

      readingButton.addEventListener('click', function() {
        readingFocus = !readingFocus;
        applyReadingFocus();
        try {
          localStorage.setItem('delftia-reading-focus', String(readingFocus));
        } catch {
          // Keep reading focus usable when browser storage is unavailable.
        }
      });

      button.addEventListener('click', function() {
        explicitTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(explicitTheme);
        try {
          localStorage.setItem('delftia-theme', explicitTheme);
        } catch {
          // Keep the selected theme for this page even without storage.
        }
      });
    });
  })();
</script>
