<a class="skip-link" href="#quarto-document-content">Skip to main content</a>
<script>
  (function () {
    const moveSkipLink = () => {
      const skipLink = document.querySelector(".skip-link");
      const firstBodyElement = document.body.firstElementChild;

      if (
        skipLink &&
        firstBodyElement &&
        skipLink.classList.contains("skip-link") &&
        skipLink !== firstBodyElement
      ) {
        document.body.insertBefore(skipLink, firstBodyElement);
      }
    };

    const fixNavToggleRole = () => {
      document
        .querySelectorAll(".navbar-toggler[role='menu']")
        .forEach((navToggle) => navToggle.removeAttribute("role"));
    };

    moveSkipLink();

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => {
        moveSkipLink();
        fixNavToggleRole();
      });
    } else {
      fixNavToggleRole();
    }
  })();
</script>
